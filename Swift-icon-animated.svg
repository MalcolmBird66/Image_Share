<svg xmlns="http://www.w3.org/2000/svg" viewBox="280 210 520 520" width="520" height="520" role="img" aria-label="Swift Automation animated icon">
<title>Swift Automation &amp; Control Systems</title>
<style>

svg *{animation-fill-mode:both}

/* master fade so the loop resets cleanly */
.master{animation:saMaster 12s linear infinite both}
@keyframes saMaster{0%,3%{opacity:0}6%,80%{opacity:1;animation-timing-function:ease-in-out}97%,100%{opacity:0}}

.grid{animation:saGrid 12s ease-out infinite both}
@keyframes saGrid{0%,3%{opacity:0}10%,100%{opacity:1}}

/* circuit traces drawing in */
.trace{fill:none;stroke:#f05023;stroke-opacity:.5;stroke-width:2;stroke-linejoin:round;stroke-dasharray:100;animation:saDraw 12s cubic-bezier(.65,0,.35,1) infinite both}
.trace.d1{animation-delay:.08s}.trace.d2{animation-delay:.16s}.trace.d3{animation-delay:.24s}
@keyframes saDraw{0%,4%{stroke-dashoffset:100}20%,100%{stroke-dashoffset:0}}

.pad{fill:#3A3A3C;stroke:#f05023;stroke-width:2;animation:saPad 12s ease-out infinite both}
@keyframes saPad{0%,17%{opacity:0}21%,100%{opacity:1}}

/* data pulses running in to the mark */
.pulses{animation:saPulses 12s linear infinite both}
@keyframes saPulses{0%,34%{opacity:0}40%,100%{opacity:1}}
.pulse{fill:none;stroke:#fdb814;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 93;animation:saPulse 2.4s linear infinite;animation-fill-mode:none}
.pulse.p1{animation-delay:-.6s}.pulse.p2{animation-delay:-1.2s}.pulse.p3{animation-delay:-1.8s}
@keyframes saPulse{from{stroke-dashoffset:0}to{stroke-dashoffset:100}}

/* ring reveal */
.ringmask{fill:none;stroke:#fff;stroke-width:16;stroke-dasharray:100;animation:saRing 12s cubic-bezier(.65,0,.35,1) infinite both}
@keyframes saRing{0%,14%{stroke-dashoffset:100}34%,100%{stroke-dashoffset:0}}
.ringglow{animation:saRingGlow 12s ease-out infinite both}
@keyframes saRingGlow{0%,33%{opacity:0}37%{opacity:1}52%,100%{opacity:.4}}

/* orbiting spark round the ring */
.orbitwrap{animation:saOrbitWrap 12s linear infinite both}
@keyframes saOrbitWrap{0%,37%{opacity:0}44%,100%{opacity:1}}
.orbit{fill:none;stroke:#ffe1a1;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:5 45;animation:saOrbit 3.2s linear infinite;animation-fill-mode:none}
@keyframes saOrbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}

/* S scan-in */
.smaskrect{transform-box:fill-box;transform-origin:50% 100%;animation:saSGrow 12s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes saSGrow{0%,30%{transform:scaleY(0)}46%,100%{transform:scaleY(1)}}
.scan{opacity:0;animation:saScan 12s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes saScan{0%,30%{transform:translateY(0);opacity:0}31%{opacity:1}46%{transform:translateY(-130px);opacity:1}48%,100%{transform:translateY(-130px);opacity:0}}
.sglow{animation:saSGlow 12s ease-out infinite both}
@keyframes saSGlow{0%,45%{opacity:0}49%{opacity:.9}60%,100%{opacity:.3}}
.glitch{opacity:0;animation:saGlitchA 12s steps(1,end) infinite both}
.glitch.g2{animation-name:saGlitchB}
@keyframes saGlitchA{0%,47%{opacity:0;transform:translateX(0)}47.6%{opacity:.75;transform:translateX(4px)}48.2%{opacity:0}49.2%{opacity:.6;transform:translateX(-2px)}49.8%,100%{opacity:0}}
@keyframes saGlitchB{0%,47.3%{opacity:0;transform:translateX(0)}47.9%{opacity:.7;transform:translateX(-4px)}48.6%{opacity:0}49.5%{opacity:.5;transform:translateX(3px)}50.1%,100%{opacity:0}}

/* wordmark */
.wmwipe{transform-box:fill-box;transform-origin:0 50%;animation:saWipe 12s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes saWipe{0%,48%{transform:scaleX(0)}62%,100%{transform:scaleX(1)}}
.wm1{animation:saWm1 12s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes saWm1{0%,48%{transform:translateX(-24px)}62%,100%{transform:translateX(0)}}
.rule{transform-box:fill-box;transform-origin:50% 50%;animation:saRule 12s cubic-bezier(.65,0,.35,1) infinite both}
@keyframes saRule{0%,54%{transform:scaleX(0)}64%,100%{transform:scaleX(1)}}
.wm2{animation:saWm2 12s ease-out infinite both}
@keyframes saWm2{0%,60%{opacity:0;transform:translateY(10px)}68%,100%{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion: reduce){
svg *{animation:none!important}
.scan,.glitch{opacity:0!important}
}
</style>
